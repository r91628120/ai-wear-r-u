<h1>關於我們</h1>

<p>
AI WEAR R U 是一個結合 AI 與形象顧問概念的個人形象平台，
致力於協助使用者從穿搭、髮型、配件到個人品牌建立，
打造更自信、更專業、更符合自身特色的形象。
</p>

<p>
我們相信，每個人都值得擁有專屬的形象顧問。
透過 AI 技術，讓專業穿搭建議變得更容易取得，
無論是日常穿搭、面試、講師授課、商務會議、
個人品牌拍攝或熟齡形象設計，都能找到適合自己的風格。
</p>

<h2>我們的願景</h2>

<p>
讓 AI 成為每個人的個人形象顧問，
幫助更多人在生活、工作與夢想道路上展現最佳自己。
</p>
